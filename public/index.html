<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Port de plaisance Russell</title>

  <link rel="stylesheet" href="/stylesheets/style.css">
</head>

<body>

  <header>
    <h1>Port de plaisance Russell</h1>
  </header>

  <main>

    <section>
      <h2>Bienvenue</h2>

      <p>
        Bienvenue sur l'application de gestion du
        port de plaisance Russell.
      </p>

      <p>
        Cette application permet de gérer les catways,
        les réservations et les utilisateurs du port.
      </p>
    </section>


    <section>
      <h2>Connexion</h2>

      <form id="login-form">

        <div>
          <label for="email">
            Email
          </label>

          <input type="email" id="email" name="email" required>
        </div>

        <div>
          <label for="password">
            Mot de passe
          </label>

          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit">
          Se connecter
        </button>

      </form>

      <p id="login-message"></p>
    </section>


    <section>
      <h2>Documentation</h2>

      <p>
        <a href="/documentation.html">
          Consulter la documentation de l'API
        </a>
      </p>
    </section>

  </main>

  <script src="/javascripts/login.js"></script>

</body>

</html>
