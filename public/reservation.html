<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Détail réservation - Port Russell</title>

    <link rel="stylesheet" href="/stylesheets/style.css">
</head>

<body>

    <header>
        <h1>Détail de la réservation</h1>

        <a href="/reservations.html">
            Retour aux réservations
        </a>
    </header>

    <main>

        <section>

            <p>
                <strong>Catway :</strong>
                <span id="catway-number"></span>
            </p>

            <p>
                <strong>Client :</strong>
                <span id="client-name"></span>
            </p>

            <p>
                <strong>Bateau :</strong>
                <span id="boat-name"></span>
            </p>

            <p>
                <strong>Date d'arrivée :</strong>
                <span id="check-in"></span>
            </p>

            <p>
                <strong>Date de départ :</strong>
                <span id="check-out"></span>
            </p>

        </section>

        <p id="reservation-message"></p>

    </main>

    <script src="/javascripts/reservation.js"></script>

</body>

</html>
